</svg>`;return`data:image/svg+xml,${encodeURIComponent(l)}`}var ah=[{id:1,title:"Mình đã dùng AI để viết 30 bài trong 30 ngày như thế nào?",category:"AI",excerpt:"Không phải AI viết thay mình. Mình dùng AI như một trợ lý nghiên cứu, phản biện và chỉnh sửa — đây là hệ thống 3 bước mình đã thử.",content:["Mình bắt đầu thử thách 30 ngày viết liên tục với một nỗi sợ quen thuộc: sẽ hết ý. Tuần đầu mình cố viết tay 100%, nhưng đến ngày thứ 8 thì cạn.","Mình đổi cách tiếp cận: AI không phải người viết thay, mà là người đồng hành. Mỗi sáng mình ném cho nó một câu hỏi thô, nó trả lại 5 góc nhìn, 3 phản biện và một dàn ý.","Quy trình của mình gồm: 1) Brain dump 10 phút, 2) Nhờ AI sắp xếp và tìm lỗ hổng logic, 3) Viết tay lại toàn bộ bằng giọng của mình. Nhờ vậy mình giữ được chất riêng nhưng tốc độ tăng gấp đôi.","Điều quan trọng nhất mình học được: AI không làm bạn lười viết đi, nó làm bạn không có cớ để không viết."],cover:zn("#FFF0E0","#D96C33","AI • 30 NGÀY"),dateLabel:"12.04.2025",publishedAt:"2025-04-12T08:00:00.000Z",featured:!0,readTime:5},{id:2,title:"Xây kênh từ con số 0 khi bạn là người hướng nội",category:"Cong viec",excerpt:"Mình không giỏi nói trước camera. Mình xây kênh bằng cách viết trước, nói sau, và hệ thống hoá mọi thứ.",content:["Là người hướng nội, mình từng nghĩ xây kênh là việc của người hướng ngoại. Sau 6 tháng thử, mình nhận ra hướng nội lại là lợi thế nếu bạn có hệ thống.","Mình bắt đầu bằng viết. Mỗi bài viết là một kịch bản video sau này. Mình ghi âm giọng mình đọc lại, chỉnh sửa đến khi nghe tự nhiên.","Thay vì đăng mỗi ngày, mình đăng 2 bài/tuần nhưng mỗi bài đều được chuẩn bị kỹ. Sự đều đặn thắng sự bùng nổ."],cover:zn("#EEF2FF","#2563EB","HƯỚNG NỘI"),dateLabel:"28.03.2025",publishedAt:"2025-03-28T09:30:00.000Z",featured:!1,readTime:6},{id:3,title:"Hệ thống ghi chú thứ hai: Mình đã bỏ Notion để về với giấy và Obsidian",category:"Cuoc song",excerpt:"Notion đẹp nhưng nặng. Mình quay về giấy cho ý tưởng thoáng qua và Obsidian cho suy nghĩ dài hạn.",content:["Mình từng xây cả một vũ trụ trong Notion. Rồi một ngày mình mở nó lên và không muốn viết gì cả. Quá nhiều cấu trúc làm mình ngại bắt đầu.","Bây giờ mình dùng giấy A5 cho mọi thứ vụn vặt, Obsidian cho những ghi chú được ủ lâu. Không tag phức tạp, chỉ liên kết.","Kết quả là mình viết nhiều hơn và tìm lại ý cũ nhanh hơn, vì hệ thống đủ đơn giản để não mình nhớ được."],cover:zn("#F0FFF4","#059669","GIẤY & OBSIDIAN"),dateLabel:"15.03.2025",publishedAt:"2025-03-15T07:00:00.000Z",featured:!0,readTime:4},{id:4,title:"Prompt mình dùng mỗi sáng để lên kế hoạch ngày mới với AI",category:"AI",excerpt:"Một prompt 5 dòng giúp mình bớt choáng và bắt đầu ngày với 3 việc quan trọng nhất.",content:["Mỗi sáng mình mở AI và dán prompt này: 'Hôm nay mình có [3 việc]. Năng lượng mình ở mức 6/10. Hãy giúp mình sắp xếp theo mức tập trung, thêm 1 việc đệm, và chặn thời gian nghỉ.'","AI sẽ trả lại một lịch trình theo khối 90 phút. Mình chỉ cần chỉnh 10% là dùng được.","Điều hay nhất là nó nhắc mình chừa khoảng trống. Không có khoảng trống, ngày nào cũng vỡ kế hoạch."],cover:zn("#FFF7ED","#D96C33","PROMPT SÁNG"),dateLabel:"02.04.2025",publishedAt:"2025-04-02T07:00:00.000Z",featured:!0,readTime:3},{id:5,title:"Viết lách như một thói quen, không phải tài năng",category:"Cong viec",excerpt:"Mình viết dở trong 2 năm đầu. Thứ giúp mình tiếp tục là một lịch trình, không phải cảm hứng.",content:["Mình từng đợi cảm hứng mới viết. Kết quả là 3 tháng không có bài nào. Sau đó mình đặt lịch: 7h30 sáng, 300 chữ, không chỉnh sửa.","Khi viết trở thành thói quen, chất lượng tự đến sau. Bạn không cần viết hay, bạn cần viết đều.","Giờ mình có 400 ngày streak trên giấy. Không phải ngày nào cũng hay, nhưng ngày nào cũng có."],cover:zn("#F6F1E8","#121212","THÓI QUEN VIẾT"),dateLabel:"20.02.2025",publishedAt:"2025-02-20T08:00:00.000Z",featured:!1,readTime:4},{id:6,title:"Một tuần làm việc 4 ngày thử nghiệm ở Hà Nội",category:"Cuoc song",excerpt:"Mình thử làm việc 4 ngày/tuần trong một tháng. Đây là những gì mình giữ lại và bỏ đi.",content:["Mình thử nghiệm 4 ngày làm việc để có 3 ngày cho bản thân. Tuần đầu tiên mình làm bù 10 tiếng mỗi ngày và kiệt sức.","Tuần thứ hai mình học cách nói không. Không họp sau 4h chiều, không nhận việc gấp vào thứ 5.","Sau một tháng, thu nhập giảm 15% nhưng mình đọc được 4 cuốn sách và ngủ đủ. Mình quyết định giữ mô hình 4.5 ngày."],cover:zn("#FFF1F2","#DC2626","4 NGÀY / TUẦN"),dateLabel:"10.02.2025",publishedAt:"2025-02-10T10:00:00.000Z",featured:!1,readTime:5}],ff={dateFormat:"dmy",showDate:!0,showTime:!0,showCategory:!0,showAuthor:!0,layout:"list",bgColor:"#FFFCF5",accentColor:"#D96C33",sectionOrder:["hero","featured","all","about","newsletter"]},df={bio1:"Mình là Q. — người viết về AI, công việc sáng tạo và cuộc sống tối giản ở Hà Nội. Mình tin vào việc viết mỗi ngày và hệ thống nhỏ mà bền.",bio2:"Blog này là nơi mình thử nghiệm ý tưởng, ghi lại những gì học được và chia sẻ template mình dùng hàng ngày. Không có thuật toán, chỉ có chữ.",links:[{label:"LinkedIn",href:"https://linkedin.com"},{label:"Twitter",href:"https://twitter.com"},{label:"Email",href:"mailto:hello@qv.blog"}]},ch="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400' viewBox='0 0 400 400'><rect width='400' height='400' fill='#FFF0E0'/><circle cx='200' cy='165' r='70' fill='#D96C33'/><path d='M80 360 C80 260 320 260 320 360' fill='#121212'/><circle cx='178' cy='155' r='8' fill='#FFFCF5'/><circle cx='222' cy='155' r='8' fill='#FFFCF5'/></svg>");function yi(e,n){if(!e)return new Date().toISOString();let r=new Date(`${e}T${n||"08:00"}:00`);if(isNaN(r.getTime()))return new Date().toISOString();return r.toISOString()}function pf(e){try{let n=new Date(e);if(isNaN(n.getTime()))throw Error("invalid");let t=(a)=>String(a).padStart(2,"0"),r=n.getFullYear(),l=t(n.getMonth()+1),u=t(n.getDate()),o=t(n.getHours()),i=t(n.getMinutes());return{date:`${r}-${l}-${u}`,time:`${o}:${i}`}}catch{return{date:new Date().toISOString().s
