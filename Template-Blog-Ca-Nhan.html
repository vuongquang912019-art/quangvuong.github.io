g:"AI",excerpt:"Không phải để AI viết thay, mà là để nó làm trợ lý tư duy. Đây là quy trình mình đã thử và giữ lại được sau 1 tháng.",date:"12.04.2025",read:"6 phút đọc",cover:Vn[0],featured:!0,content:["Tuần đầu tiên, mình cố gắng để ChatGPT viết toàn bộ. Kết quả: bài nào cũng giống nhau, nhạt và không có mình trong đó.","Sau đó mình đổi lại. Mình viết dàn ý bằng tay, ném cho AI phản biện. Nó hỏi lại mình: 'Ý này mâu thuẫn với ý trên thì sao?' — và tự nhiên bài viết sâu hơn.",`**Quy trình hiện tại của mình có 3 bước:**
1. Brain dump 15 phút ra giấy.
2. Đưa cho AI sắp xếp lại, tìm lỗ hổng logic.
3. Tự viết lại bằng giọng của mình, chỉ giữ 20% câu chữ của AI.`,"Mình nhận ra AI giỏi nhất không phải ở việc viết, mà ở việc làm mình không lười suy nghĩ. Nó như một người bạn hơi khó tính, luôn bắt mình phải rõ ràng hơn."]},{id:2,title:"Xây kênh từ con số 0 khi bạn là người hướng nội",category:"Công việc",tag:"Công việc",excerpt:"Mình không giỏi nói trước camera. Vậy nên mình bắt đầu bằng viết. Và đây là những gì mình học được sau 2000 followers đầu tiên.",date:"28.03.2025",read:"8 phút đọc",cover:Vn[1],featured:!0,content:["Mọi người hay nghĩ phải thật extrovert mới làm được nội dung. Mình thì ngược lại, mình nạp năng lượng bằng cách ở một mình.","Vì thế mình chọn viết. Mỗi tuần 2 bài dài trên blog này, 3 bài ngắn trên Threads. Không quay video nếu hôm đó không có tâm trạng.","Điều bất ngờ là: người hướng nội lại có lợi thế. Mình quan sát kỹ hơn, lắng nghe comment kỹ hơn, và không bị cuốn vào việc phải xuất hiện liên tục.","Nếu bạn cũng giống mình, hãy thử bắt đầu với thứ khiến bạn ít sợ nhất. Với mình là viết 200 chữ mỗi ngày. Đủ nhỏ để không bỏ."]},{id:3,title:"Hệ thống ghi chú thứ hai: Mình đã bỏ Notion để về với giấy và Obsidian",category:"Cuộc sống",tag:"Cuộc sống",excerpt:"Sau 2 năm thử đủ loại app productivity, mình nhận ra công cụ càng đơn giản, mình càng làm được nhiều việc hơn.",date:"15.03.2025",read:"5 phút đọc",cover:Vn[2],featured:!0,content:["Notion của mình từng có 48 databases. Mình dành nhiều thời gian trang trí nó hơn là làm việc thật.","Tháng trước mình xóa hết. Chỉ giữ lại 3 thứ: một file daily note, một file ideas, một file projects.","Giấy thì dùng để nghĩ. Obsidian thì dùng để lưu. Không đồng bộ, không màu mè, chỉ là chữ.","Và lạ lắm, khi bỏ bớt, mình lại nhớ nhiều hơn. Vì não mình phải tự kết nối, thay vì để app kết nối hộ."]},{id:4,title:"Prompt mình dùng mỗi sáng để lên kế hoạch ngày mới với AI",category:"AI",tag:"AI",excerpt:"Một prompt duy nhất, copy là dùng được. Giúp mình bớt ngợp và biết hôm nay nên tập trung vào 1 việc gì.",date:"02.04.2025",read:"4 phút đọc",cover:Vn[3],content:["Mình dán prompt này vào mỗi 7h sáng: 'Hôm nay mình có [3 việc]. Mình đang lo lắng về [điều này]. Hãy giúp mình chọn 1 việc quan trọng nhất và chia nó thành 3 bước nhỏ trong 90 phút đầu'.","AI không cho mình lời khuyên sáo rỗng. Nó bắt mình phải nói ra nỗi lo thật. Và khi nói ra được, tự nhiên mình đã giải quyết được 50%."]},{id:5,title:"Viết lách như một thói quen, không phải tài năng",category:"Công việc",tag:"Công việc",excerpt:"Mình đã viết dở trong 3 năm. Đến năm thứ 4, tự nhiên có người nói: 'Bài của ông đọc cuốn phết'. Bí quyết chỉ là không dừng lại.",date:"20.02.2025",read:"7 phút đọc",cover:Vn[4],content:["Ngày đầu mình viết, mình mất 3 tiếng cho 300 chữ. Giờ mình viết 800 chữ trong 40 phút.","Không phải vì mình giỏi hơn. Mà vì mình đã viết đủ nhiều để não mình bớt sợ trang trắng.","Mình đặt luật: viết 25 phút, không sửa. Sửa vào ngày hôm sau. Nhờ vậy mình không bị kẹt ở câu đầu tiên nữa."]},{id:6,title:"Một tuần làm việc 4 ngày thử nghiệm ở Hà Nội: mình đã làm gì?",category:"Cuộc sống",tag:"Cuộc sống",excerpt:"Mình thử làm 4 ngày/tuần trong tháng 3. Không phải để lười hơn, mà để xem mình có tập trung hơn không.",date:"10.02.2025",read:"6 phút đọc",cover:Vn[5],content:["Thứ 6 mình tắt laptop, đi xe lên Long Biên ngồi cà phê, đọc sách, không mở Notion.","Điều mình học được: khi biết chỉ có 4 ngày, mình tự nhiên nói 'không' nhiều hơn. Ít meeting, ít việc vặt.","Năng suất tuần đó không giảm. Thậm chí bài viết tuần đó lại là bài được share nhiều nhất.","Mình sẽ tiếp tục thử 1 tháng nữa. Có thể đây là cách làm việc mình sẽ giữ lâu dài."]}],Eh=["Tất cả","AI","Cuộc sống","Công việc"],Sh=["AI","Cuộc sống","Công việc"],Tc="qv_blog_posts_v2",Bo="qv_avatar_v2";function Mc(e,n=800,t=0.82){return new Promise((r,l)=>{let u=new FileReader;u.onload=()=>{let i=new Image;i.onload=()=>{let{width:o,height:a}=i;if(o>n){let g=n/o;o=n,a=a*g}if(a>n*1.4){let g=n*1.4/a;a=n*1.4,o=o*g}let f=document.createElement("canvas");f.width=o,f
